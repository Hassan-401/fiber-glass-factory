<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>كل المنتجات | مصنع الشروق للفايبر جلاس</title>
<meta name="description" content="أكثر من 110 منتج فايبر جلاس: خزانات، أبراج تبريد، أعمدة إنارة، أكشاك حراسة، ألعاب أطفال، مظلات، قوارب، مواسير GRP وأجزاء أتوبيسات. اطلب عبر واتساب.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230d2440'/><text y='68' x='50' text-anchor='middle' font-size='54' fill='%23cfa03b' font-family='Arial'>ش</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="products">

<div id="site-topbar"></div>
<div id="site-header"></div>

<section class="page-hero">
  <div class="container">
    <h1 id="pageTitle">كل المنتجات</h1>
    <p id="pageSub">تصفح أكثر من ١١٠ منتج فايبر جلاس، واطلب أي منتج مباشرة عبر واتساب بضغطة واحدة.</p>
  </div>
</section>

<nav class="crumbs" aria-label="مسار التنقل">
  <div class="container">
    <ol id="crumbs"></ol>
  </div>
</nav>

<section class="section">
  <div class="container">

    <div class="toolbar">
      <div class="search">
        <input type="search" id="q" placeholder="ابحث عن منتج … مثال: خزان، برج تبريد، كشك" aria-label="بحث في المنتجات">
        <span id="searchIco"></span>
      </div>
      <select class="select" id="sort" aria-label="ترتيب النتائج">
        <option value="default">الترتيب: الافتراضي</option>
        <option value="featured">الأكثر طلباً أولاً</option>
        <option value="az">الاسم: أ ← ي</option>
        <option value="za">الاسم: ي ← أ</option>
      </select>
      <span class="result-count" id="count"></span>
    </div>

    <div class="chips" id="chips"></div>
    <div class="prod-grid" id="grid"></div>
    <div id="empty"></div>

  </div>
</section>

<section class="cta">
  <div class="container">
    <h2>تحتاج مقاساً أو تصميماً خاصاً؟</h2>
    <p>أرسل لنا الرسم أو المواصفات على واتساب، وسيرد عليك القسم الهندسي بعرض سعر مفصل خلال 48 ساعة.</p>
    <div class="cta__btns" id="ctaBtns"></div>
  </div>
</section>

<div id="site-footer"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/icons.js"></script>
<script src="assets/js/main.js"></script>
<script>
boot(function () {
  const params  = new URLSearchParams(location.search);
  let activeCat = params.get('cat') || 'all';
  if (activeCat !== 'all' && !catById(activeCat)) activeCat = 'all';
  let term = (params.get('q') || '').trim();
  let sort = 'default';

  $('#searchIco').innerHTML = icon('search');
  $('#q').value = term;

  /* ترويسة الصفحة حسب القسم */
  function head() {
    const c = catById(activeCat);
    $('#pageTitle').textContent = c ? c.name : 'كل المنتجات';
    $('#pageSub').textContent   = c ? c.desc : 'تصفح أكثر من ١١٠ منتج فايبر جلاس، واطلب أي منتج مباشرة عبر واتساب بضغطة واحدة.';
    $('#crumbs').innerHTML =
      `<li><a href="index.html">الرئيسية</a></li>` +
      (c ? `<li><a href="categories.html">الأقسام</a></li><li aria-current="page">${esc(c.short)}</li>`
         : `<li aria-current="page">كل المنتجات</li>`);
    document.title = (c ? c.name : 'كل المنتجات') + ' | ' + SITE.name;
  }

  /* شرائح الأقسام */
  $('#chips').innerHTML =
    `<button class="chip" data-cat="all">كل الأقسام (${PRODUCTS.length})</button>` +
    CATEGORIES.map(c => `<button class="chip" data-cat="${c.id}">${esc(c.short)} (${c.count})</button>`).join('');

  function render() {
    head();
    $$('#chips .chip').forEach(b => b.classList.toggle('is-active', b.dataset.cat === activeCat));

    let list = PRODUCTS.filter(p => activeCat === 'all' || p.cat === activeCat);

    if (term) {
      const t = term.toLowerCase();
      list = list.filter(p => {
        const c = catById(p.cat);
        return (p.name + ' ' + p.desc + ' ' + (c ? c.name : '') + ' ' +
                Object.values(p.specs).join(' ') + ' ' + p.feat.join(' ')).toLowerCase().includes(t);
      });
    }

    if (sort === 'az') list = [...list].sort((a, b) => a.name.localeCompare(b.name, 'ar'));
    if (sort === 'za') list = [...list].sort((a, b) => b.name.localeCompare(a.name, 'ar'));
    if (sort === 'featured') list = [...list].sort((a, b) => (b.featured ? 1 : 0) - (a.featured ? 1 : 0));

    $('#count').textContent = `${list.length} منتج`;
    $('#grid').innerHTML = list.map(productCard).join('');
    $('#empty').innerHTML = list.length ? '' : `
      <div class="empty">
        ${icon('search')}
        <h3>لا توجد نتائج مطابقة</h3>
        <p>جرّب كلمة بحث أخرى أو اختر قسماً مختلفاً، أو اسألنا مباشرة على واتساب.</p>
        <a class="btn btn-wa" href="${waLink()}" target="_blank" rel="noopener" style="margin-top:14px">${icon('whatsapp')} اسأل عن منتجك</a>
      </div>`;

    /* تفعيل حركة الظهور للعناصر الجديدة */
    $$('#grid .reveal').forEach(el => el.classList.add('in'));

    /* تحديث الرابط بدون إعادة تحميل */
    try {
      const u = new URL(location.href);
      activeCat === 'all' ? u.searchParams.delete('cat') : u.searchParams.set('cat', activeCat);
      term ? u.searchParams.set('q', term) : u.searchParams.delete('q');
      history.replaceState(null, '', u);
    } catch (e) { /* file:// لا يسمح بتعديل الرابط */ }
  }

  $$('#chips .chip').forEach(b => b.addEventListener('click', () => {
    activeCat = b.dataset.cat;
    render();
    const top = $('.toolbar').getBoundingClientRect().top + window.scrollY - 120;
    window.scrollTo({ top, behavior: 'smooth' });
  }));

  let deb;
  $('#q').addEventListener('input', e => {
    clearTimeout(deb);
    deb = setTimeout(() => { term = e.target.value.trim(); render(); }, 220);
  });
  $('#sort').addEventListener('change', e => { sort = e.target.value; render(); });

  render();

  $('#ctaBtns').innerHTML =
    `<a class="btn btn-wa btn-lg" href="${waLink()}" target="_blank" rel="noopener">${icon('whatsapp')} تواصل عبر واتساب</a>` +
    `<a class="btn btn-ghost-light btn-lg" href="contact.html">${icon('mail')} أرسل استفسارك</a>`;
});
</script>
</body>
</html>
