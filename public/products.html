<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>كل المنتجات | سوق مصرية فيبر جلاس</title>
<meta name="description" content="كل منتجات سوق مصرية فيبر جلاس بالصور — ابحث وفلتر حسب القسم واطلب مباشرة عبر واتساب.">
<link rel="icon" href="assets/img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="products">

<div id="site-header"></div>

<section class="page-hero">
  <div class="container">
    <h1 id="pageTitle">كل المنتجات</h1>
    <p id="pageSub">تصفح أكثر من ١١٠ منتج فيبر جلاس، واطلب أي منتج مباشرة عبر واتساب بضغطة واحدة.</p>
  </div>
</section>

<nav class="crumbs" aria-label="مسار التنقل">
  <div class="container">
    <ol id="crumbs"></ol>
  </div>
</nav>

<section class="section">
  <div class="container">

    <div class="toolbar">
      <div class="search">
        <input type="search" id="q" placeholder="ابحث عن منتج … مثال: خزان، برج تبريد، كشك" aria-label="بحث في المنتجات">
        <span id="searchIco"></span>
      </div>
      <select class="select" id="cat" aria-label="تصفية حسب القسم"></select>
      <select class="select" id="sort" aria-label="ترتيب النتائج">
        <option value="default">الترتيب: الافتراضي</option>
        <option value="featured">الأكثر طلباً أولاً</option>
        <option value="az">الاسم: أ ← ي</option>
        <option value="za">الاسم: ي ← أ</option>
      </select>
      <span class="result-count" id="count"></span>
    </div>
    <div class="prod-grid" id="grid"></div>
    <div id="empty"></div>

  </div>
</section>

<section class="cta">
  <div class="container">
    <h2>تحتاج مقاساً أو تصميماً خاصاً؟</h2>
    <p>أرسل لنا الرسم أو المواصفات على واتساب، وسيرد عليك القسم الهندسي بعرض سعر مفصل خلال 48 ساعة.</p>
    <div class="cta__btns" id="ctaBtns"></div>
  </div>
</section>

<div id="site-footer"></div>

<script src="assets/js/i18n.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/icons.js"></script>
<script src="assets/js/main.js"></script>
<script>
boot(function () {
  const params  = new URLSearchParams(location.search);
  let activeCat = params.get('cat') || 'all';
  if (activeCat !== 'all' && !catById(activeCat)) activeCat = 'all';
  let term = (params.get('q') || '').trim();
  let sort = 'default';

  $('#searchIco').innerHTML = icon('search');
  $('#q').value = term;

  /* ترويسة الصفحة حسب القسم */
  function head() {
    const c = catById(activeCat);
    $('#pageTitle').textContent = c ? c.name : 'كل المنتجات';
    $('#pageSub').textContent   = c ? c.desc : 'تصفح أكثر من ١١٠ منتج فيبر جلاس، واطلب أي منتج مباشرة عبر واتساب بضغطة واحدة.';
    $('#crumbs').innerHTML =
      `<li><a href="index.html">الرئيسية</a></li>` +
      (c ? `<li><a href="categories.html">الأقسام</a></li><li aria-current="page">${esc(c.short)}</li>`
         : `<li aria-current="page">كل المنتجات</li>`);
    document.title = (c ? c.name : T('كل المنتجات')) + ' | ' + SITE.name;
  }

  /* قائمة الأقسام — في الشريط جنب الترتيب عشان المنتجات تبان على طول */
  $('#cat').innerHTML =
    `<option value="all">كل الأقسام (${PRODUCTS.length})</option>` +
    CATEGORIES.map(c => `<option value="${c.id}">${esc(c.short)} (${c.count})</option>`).join('');

  function render() {
    head();
    if ($('#cat').value !== activeCat) $('#cat').value = activeCat;

    let list = PRODUCTS.filter(p => activeCat === 'all' || p.cat === activeCat);

    if (term) {
      const t = term.toLowerCase();
      list = list.filter(p => {
        const c = catById(p.cat);
        return (p.name + ' ' + p.desc + ' ' + (p.group || '') + ' ' +
                (c ? c.name + ' ' + c.short : '') + ' ' + p.id).toLowerCase().includes(t);
      });
    }

    if (sort === 'az') list = [...list].sort((a, b) => a.name.localeCompare(b.name, 'ar'));
    if (sort === 'za') list = [...list].sort((a, b) => b.name.localeCompare(a.name, 'ar'));
    if (sort === 'featured') list = [...list].sort((a, b) => (b.featured ? 1 : 0) - (a.featured ? 1 : 0));

    $('#count').textContent = `${list.length} منتج`;
    $('#grid').innerHTML = list.map(productCard).join('');
    /* قسم موجود فعلاً لكن لسه مفيش له صور ≠ بحث بدون نتيجة */
    const emptyCat = !list.length && !term && activeCat !== 'all' ? catById(activeCat) : null;

    $('#empty').innerHTML = list.length ? '' : (emptyCat ? `
      <div class="empty">
        ${icon(emptyCat.icon)}
        <h3>${esc(emptyCat.name)} — الصور قريباً</h3>
        <p>${esc(emptyCat.desc)}</p>
        <p>القسم ده متوفّر عندنا وبنوفّره حسب الطلب، بس لسه منزّلناش صوره على الموقع.
           ابعتلنا على واتساب بالمقاس أو الرسم المطلوب ونرد عليك بالتفاصيل والسعر.</p>
        <a class="btn btn-wa" href="${waLink({ id: emptyCat.id, name: emptyCat.name, cat: emptyCat.id })}"
           target="_blank" rel="noopener" style="margin-top:14px">${icon('whatsapp')} اسأل عن ${esc(emptyCat.short)}</a>
      </div>` : `
      <div class="empty">
        ${icon('search')}
        <h3>لا توجد نتائج مطابقة</h3>
        <p>جرّب كلمة بحث أخرى أو اختر قسماً مختلفاً، أو اسألنا مباشرة على واتساب.</p>
        <a class="btn btn-wa" href="${waLink()}" target="_blank" rel="noopener" style="margin-top:14px">${icon('whatsapp')} اسأل عن منتجك</a>
      </div>`);

    /* تفعيل حركة الظهور للعناصر الجديدة */
    $$('#grid .reveal').forEach(el => el.classList.add('in'));

    /* تحديث الرابط بدون إعادة تحميل */
    try {
      const u = new URL(location.href);
      activeCat === 'all' ? u.searchParams.delete('cat') : u.searchParams.set('cat', activeCat);
      term ? u.searchParams.set('q', term) : u.searchParams.delete('q');
      history.replaceState(null, '', u);
    } catch (e) { /* file:// لا يسمح بتعديل الرابط */ }
  }

  $('#cat').addEventListener('change', e => {
    activeCat = e.target.value;
    render();
  });

  let deb;
  $('#q').addEventListener('input', e => {
    clearTimeout(deb);
    deb = setTimeout(() => { term = e.target.value.trim(); render(); }, 220);
  });
  $('#sort').addEventListener('change', e => { sort = e.target.value; render(); });

  render();

  $('#ctaBtns').innerHTML =
    `<a class="btn btn-wa btn-lg" href="${waLink()}" target="_blank" rel="noopener">${icon('whatsapp')} تواصل عبر واتساب</a>` +
    `<a class="btn btn-ghost-light btn-lg" href="contact.html">${icon('mail')} أرسل استفسارك</a>`;
});
</script>
</body>
</html>
