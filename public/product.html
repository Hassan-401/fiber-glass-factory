<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تفاصيل المنتج | سوق مصرية فيبر جلاس</title>
<meta name="description" content="تفاصيل منتج فيبر جلاس من مصنع سوق مصرية — اطلب عرض سعر عبر واتساب.">
<link rel="icon" href="assets/img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="products">

<div id="site-header"></div>

<nav class="crumbs" aria-label="مسار التنقل">
  <div class="container"><ol id="crumbs"></ol></div>
</nav>

<section class="section">
  <div class="container">
    <div id="pdWrap"></div>
  </div>
</section>

<section class="section section--soft" id="relatedSec" hidden>
  <div class="container">
    <div class="sec-head">
      <span class="eyebrow">من نفس القسم</span>
      <h2 class="sec-title">منتجات <span>ذات صلة</span></h2>
      <div class="divider"></div>
    </div>
    <div class="prod-grid" id="related"></div>
  </div>
</section>

<div id="site-footer"></div>

<script src="assets/js/i18n.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/icons.js"></script>
<script src="assets/js/main.js"></script>
<script>
boot(function () {
  const id = new URLSearchParams(location.search).get('id');
  const p  = id ? prodById(id) : null;

  if (!p) {
    $('#crumbs').innerHTML = `<li><a href="index.html">الرئيسية</a></li><li aria-current="page">غير موجود</li>`;
    $('#pdWrap').innerHTML = `
      <div class="empty">
        ${icon('box')}
        <h3>هذا المنتج غير متاح</h3>
        <p>ربما تم تعديل الرابط أو حذف المنتج. يمكنك تصفح كل المنتجات من الزر بالأسفل.</p>
        <a class="btn btn-navy" href="products.html" style="margin-top:14px">عرض كل المنتجات</a>
      </div>`;
    return;
  }

  const c = catById(p.cat);
  /* صور المنتج — الأولى رئيسية والباقي كاروسيل */
  const imgs = (p.images && p.images.length ? p.images : [p.img]).filter(Boolean);
  document.title = p.name + ' | ' + SITE.name;
  const md = document.querySelector('meta[name="description"]');
  if (md) md.setAttribute('content', p.desc);

  $('#crumbs').innerHTML =
    `<li><a href="index.html">الرئيسية</a></li>` +
    `<li><a href="categories.html">الأقسام</a></li>` +
    `<li><a href="products.html?cat=${c.id}">${esc(c.short)}</a></li>` +
    `<li aria-current="page">${esc(p.name)}</li>`;

  $('#pdWrap').innerHTML = `
  <div class="pd">
    <div class="pd__media reveal">
      <div class="pd__main">
        <img id="pdImg" src="${imgs[0]}" alt="${esc(p.name)}" width="800" height="600">
        ${imgs.length > 1 ? `
          <button class="pd__nav pd__nav--prev" id="pdPrev" aria-label="الصورة السابقة">${icon('chevron')}</button>
          <button class="pd__nav pd__nav--next" id="pdNext" aria-label="الصورة التالية">${icon('chevron')}</button>
          <span class="pd__counter"><b id="pdNow">1</b> / ${imgs.length}</span>` : ''}
      </div>
      ${imgs.length > 1 ? `
        <div class="pd__thumbs" id="pdThumbs">
          ${imgs.map((u, i) => `
            <button class="pd__thumb${i === 0 ? ' is-active' : ''}" data-i="${i}" aria-label="صورة ${i + 1}">
              <img src="${u}" alt="" loading="lazy">
            </button>`).join('')}
        </div>` : ''}
    </div>

    <div class="reveal d1">
      ${p.tag ? `<span class="pd__tag">${icon('tag')} ${esc(p.tag)}</span>` : ''}
      <h1>${esc(p.name)}</h1>
      <p class="pd__lead">${esc(p.desc)}</p>

      <div class="pd__price">
        ${icon('info')}
        <span>
          <b>السعر: يُحدد حسب المواصفات والكمية</b>
          <span>كود المنتج: ${p.id.toUpperCase()} — القسم: ${esc(c.name)}</span>
        </span>
      </div>

      <h3 style="margin-bottom:12px;font-size:1.05rem">بيانات المنتج</h3>
      <table class="spec-table">
        <tbody>
          <tr><th>القسم</th><td>${esc(c.name)}</td></tr>
          ${p.group ? `<tr><th>النوع</th><td>${esc(p.group)}</td></tr>` : ''}
          <tr><th>كود المنتج</th><td>${p.id.toUpperCase()}</td></tr>
          <tr><th>المقاسات</th><td>تُنفَّذ حسب الطلب — ابعتلنا المقاس المطلوب</td></tr>
          <tr><th>الخامة</th><td>فيبر جلاس (راتنج + ألياف زجاجية) بطبقة جل كوت خارجية</td></tr>
        </tbody>
      </table>

      <h3 style="margin-bottom:12px;font-size:1.05rem">مميزات الفيبر جلاس</h3>
      <ul class="feat-list">
        ${[
          'لا يصدأ ولا يتأثر بالرطوبة أو الكيماويات',
          'خفيف الوزن مقارنة بالحديد والخرسانة — أسهل في النقل والتركيب',
          'عازل للكهرباء والحرارة',
          'يُصنَّع بأي مقاس أو لون أو شكل حسب الرسم'
        ].map(f => `<li>${icon('checkSolid')}<span>${f}</span></li>`).join('')}
      </ul>

      <div class="pd__actions">
        <a class="btn btn-wa btn-lg" href="${waLink(p)}" target="_blank" rel="noopener">${icon('whatsapp')} اطلب هذا المنتج عبر واتساب</a>
        <a class="btn btn-ghost" href="tel:${SITE.phone1.replace(/\s/g,'')}">${icon('phone')} اتصل بنا</a>
        <button class="btn btn-ghost" id="shareBtn">${icon('share')} مشاركة</button>
      </div>

      <div class="pd__note">
        ${icon('info')}
        <span>عند الضغط على «اطلب عبر واتساب» ستُفتح محادثة برسالة جاهزة تحتوي على اسم المنتج وكوده ورابطه، يمكنك إرسالها كما هي أو إضافة تفاصيل طلبك.</span>
      </div>
    </div>
  </div>`;

  /* ---------- الكاروسيل ---------- */
  if (imgs.length > 1) {
    let cur = 0;
    const show = i => {
      cur = (i + imgs.length) % imgs.length;
      $('#pdImg').src = imgs[cur];
      $('#pdNow').textContent = cur + 1;
      $$('#pdThumbs .pd__thumb').forEach((t, k) => t.classList.toggle('is-active', k === cur));
    };
    $('#pdPrev').addEventListener('click', () => show(cur - 1));
    $('#pdNext').addEventListener('click', () => show(cur + 1));
    $$('#pdThumbs .pd__thumb').forEach(t =>
      t.addEventListener('click', () => show(+t.dataset.i)));
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight') show(cur - 1);      // RTL: يمين = السابق
      if (e.key === 'ArrowLeft') show(cur + 1);
    });
    /* السحب باللمس */
    const main = $('.pd__main');
    let x0 = null;
    main.addEventListener('touchstart', e => x0 = e.touches[0].clientX, { passive: true });
    main.addEventListener('touchend', e => {
      if (x0 === null) return;
      const dx = e.changedTouches[0].clientX - x0;
      if (Math.abs(dx) > 40) show(cur + (dx > 0 ? -1 : 1));
      x0 = null;
    }, { passive: true });
  }

  /* مشاركة */
  $('#shareBtn').addEventListener('click', async () => {
    const data = { title: p.name, text: p.desc, url: location.href };
    try {
      if (navigator.share) { await navigator.share(data); return; }
      await navigator.clipboard.writeText(location.href);
      toast('تم نسخ رابط المنتج');
    } catch (e) { toast('تعذّرت المشاركة — انسخ الرابط من شريط العنوان'); }
  });

  /* منتجات ذات صلة */
  const rel = PRODUCTS.filter(x => x.cat === p.cat && x.id !== p.id).slice(0, 4);
  if (rel.length) {
    $('#relatedSec').hidden = false;
    $('#related').innerHTML = rel.map(productCard).join('');
  }
});
</script>
</body>
</html>
